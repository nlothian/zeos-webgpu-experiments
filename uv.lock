    { name = "pytest-cov" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "anthropic", marker = "extra == 'claude'", specifier = ">=0.125" },
    { name = "openai", marker = "extra == 'openai'", specifier = ">=1.0" },
    { name = "zeos", editable = "." },
    { name = "zeos-space-invaders", extras = ["claude", "openai"], marker = "extra == 'all'" },
]
provides-extras = ["claude", "openai", "all"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8.0" },
    { name = "pytest-cov", specifier = ">=5.0" },
    { name = "ruff", specifier = ">=0.6" },
]
