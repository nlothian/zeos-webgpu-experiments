# The pipes of a chat agent whose tools run outside the kernel, in the host page.
#
# Ring and principal come from where text enters, never from what it says (MP §4). What
# a person types arrives at TRUSTED, the ring a peer job's words have: ring 1 is the
# descriptor body's and nothing else's. What a tool returns -- file contents, SQL rows,
# a schema, stdout -- arrives at EXTERNAL, because the host fetched it from somewhere
# nobody vouches for.
#
# Capacities are in kernel tokens, which with `KernelConfig.preserve_whitespace` are
# whitespace-delimited words with their leading whitespace attached. They are sized for
# multi-kilobyte tool arguments and results; a write that can never fit is refused
# rather than parked.

- name: chat.user
  ring: TRUSTED
  principal: user
  device: true
  capacity: 8192

- name: tools.results
  ring: EXTERNAL
  principal: tool
  device: true
  capacity: 16384

# A result the host wrote itself rather than fetched -- a reference card bundled with the
# app, say -- for a call the host's trusted-results table names
# (``open_chat(trusted_results=...)``). The machine picks this pipe from the call before
# it runs, so the ring is the host's word about its own text, never the text's word
# about itself. Reading it leaves the session floor alone: it is not a request the job
# serves, and setting the floor to 2 would undo the 3 an earlier tool result set.

- name: tools.results.trusted
  ring: TRUSTED
  principal: device
  device: true
  capacity: 16384
  session_floor: false

# A past conversation, replayed into a fresh run (``ChatRun.import_history``): the
# assistant's own earlier turns. They come back from the host's storage (principal
# device), not from the model, so they arrive at EXTERNAL unless the host recorded that a turn was written at
# TRUSTED and says so by delivering it on the trusted pipe.

- name: chat.history
  ring: EXTERNAL
  principal: device
  device: true
  capacity: 16384

- name: chat.history.trusted
  ring: TRUSTED
  principal: device
  device: true
  capacity: 16384

# The two halves of a tool call, split by what the call can do. The host's tool-class
# table decides which a call goes to, and a tool the table does not name is an effect.
# A sink's ring is what the host may assume of what it drains: a read can be asked for
# by a job reading untrusted content, so its sink is EXTERNAL.

- name: tools.read
  ring: EXTERNAL
  principal: tool
  sink: true
  capacity: 16384

- name: tools.effect
  ring: TRUSTED
  principal: tool
  sink: true
  capacity: 16384

# The assistant's reply at the end of each turn, everything it decoded in that turn.

- name: chat.out
  ring: EXTERNAL
  principal: user
  sink: true
  capacity: 16384
