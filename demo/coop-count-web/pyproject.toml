[project]
name = "zeos-coop-count-web"
version = "0.1.0"
description = "The coop-count demo in a static web page: the kernel under Pyodide, with JsMachine handing token-level work to a JavaScript model worker"
readme = "README.md"
requires-python = ">=3.12"
# The page runs on the zeos and zeos-browser wheels. This package holds what is the demo's
# own beyond the page: the reader of its measured-attention evidence.
dependencies = [
    "zeos",
    "zeos-browser",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
zeos = { workspace = true }
zeos-browser = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeos_coop_count_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "determinism: the same run under Pyodide and under CPython gives the same journal bytes",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Written down rather than inherited: ruff 0.16 changed its defaults.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
