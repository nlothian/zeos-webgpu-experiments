name: pages

# Both browser demos, built by demo/site/build.py and deployed as one Cloudflare Pages
# site. A push to main redeploys it when anything the pages are built from changed.
on:
  push:
    branches: [main]
    paths:
      - "src/zeos/**"
      - "packages/zeos-browser/**"
      - "demo/coop-count/**"
      - "demo/coop-count-web/**"
      - "demo/space-invaders/**"
      - "demo/space-invaders-web/**"
      - "demo/site/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deploy at a time, and none abandoned halfway: a later push waits for the
# deploy in flight, then deploys over it.
concurrency:
  group: pages
  cancel-in-progress: false

# Nothing is granted by default; the deploy authenticates to Cloudflare with its own
# token, so the GitHub token needs only to read the repository.
permissions: {}

env:
  # The one place the site's directory is written, so the build and the deploy cannot
  # drift apart.
  SITE: demo/site/dist

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Pinned by commit, not by tag: a tag can be moved, and this job holds a token
      # that can publish the site.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/zeos-browser/package-lock.json

      - name: Install dependencies
        # --all-packages, or the demos and zeos-browser under demo/ and packages/ are not installed.
        run: uv sync --frozen --all-packages

      - name: Install zeos-browser's npm packages
        # Each page's tokenizer is copied from here, and its ONNX Runtime Web version
        # (loaded from jsDelivr) is read from here.
        working-directory: packages/zeos-browser
        run: npm ci

      - name: Build the site
        run: uv run --frozen python demo/site/build.py --out "$SITE"

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.SITE }}
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
